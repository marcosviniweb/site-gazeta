<div class="g-filters-container">
  <div class="filter-group">
    <label for="filter-date">Data de início</label>
    <input 
      id="filter-date" 
      type="date" 
      [value]="filterDate()" 
      (input)="onDateChange($any($event.target).value)" 
    />
  </div>
  
  <div class="filter-group">
    <label for="filter-order">Ordem</label>
    <select 
      id="filter-order" 
      [value]="filterOrder() ?? ''" 
      (change)="onOrderChange($any($event.target).value)">
      <option value="">Todos</option>
      <option value="desc">Mais recente</option>
      <option value="asc">Mais antigo</option>
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-position">Posição</label>
    <select 
      id="filter-position" 
      [value]="filterPosition()" 
      (change)="onPositionChange($any($event.target).value)">
      @for (position of positions; track position.value) {
        <option [value]="position.value">{{ position.label }}</option>
      }
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-placement">Página</label>
    <select 
      id="filter-placement" 
      [value]="filterPlacement()" 
      (change)="onPlacementChange($any($event.target).value)">
      @for (placement of placements; track placement.value) {
        <option [value]="placement.value">{{ placement.label }}</option>
      }
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-status">Status</label>
    <select 
      id="filter-status" 
      [value]="filterStatus() === null ? '' : filterStatus() ? 'true' : 'false'" 
      (change)="onStatusChange($any($event.target).value)">
      @for (status of statusOptions; track status.value) {
        <option [value]="status.value">{{ status.label }}</option>
      }
    </select>
  </div>
  
  <div class="filter-group search-group">
    <label for="filter-search">Pesquisar</label>
    <input 
      id="filter-search" 
      type="text" 
      placeholder="Pesquisar anúncio..." 
      [value]="filterSearch()" 
      (input)="onSearchChange($any($event.target).value)" 
    />
  </div>
</div>
