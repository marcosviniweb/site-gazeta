<div class="g-filters-container">
  <div class="filter-group">
    <label for="filter-date">Data de publicação</label>
    <input 
      id="filter-date" 
      type="date" 
      placeholder="Data de publicação" 
      [value]="filterDate()" 
      (input)="onDateChange($any($event.target).value)" 
    />
  </div>

  <div class="filter-group">
    <label for="filter-month">Mês</label>
    <select 
      id="filter-month" 
      [value]="filterMonth() ?? ''" 
      (change)="onMonthChange($any($event.target).value)">
      <option value="">Todos</option>
      @for (month of months(); track month.value) {
        <option [value]="month.value">{{ month.label }}</option>
      }
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-year">Ano</label>
    <select 
      id="filter-year" 
      [value]="filterYear() ?? ''" 
      (change)="onYearChange($any($event.target).value)">
      <option value="">Todos</option>
      @for (year of years(); track year) {
        <option [value]="year">{{ year }}</option>
      }
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-order">Ordem</label>
    <select 
      id="filter-order" 
      [value]="filterOrder() ?? ''" 
      (change)="onOrderChange($any($event.target).value)">
      <option value="">Todos</option>
      <option value="desc">Mais recente</option>
      <option value="asc">Mais antigo</option>
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-views">Visualizações</label>
    <select 
      id="filter-views" 
      [value]="filterViews()" 
      (change)="onViewsChange($any($event.target).value)">
      <option value="">Todos</option>
      <option value="desc">Mais vistos</option>
      <option value="asc">Menos vistos</option>
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-category">Categoria</label>
    <select 
      id="filter-category" 
      [value]="filterCategory() ?? ''" 
      (change)="onCategoryChange($any($event.target).value)">
      <option value="">Todos</option>
      @for (category of categories(); track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }       
    </select>
  </div>
  
  <div class="filter-group">
    <label for="filter-emphasis">Destaque</label>
    <select 
      id="filter-emphasis" 
      [value]="filterEmphasis() === null ? '' : filterEmphasis() ? 'true' : 'false'" 
      (change)="onEmphasisChange($any($event.target).value)">
      <option value="">Todas</option>
      <option value="true">Com destaque</option>
      <option value="false">Sem destaque</option>
    </select>
  </div>
  
  <div class="filter-group search-group">
    <label for="filter-search">Pesquisar</label>
    <input 
      id="filter-search" 
      type="text" 
      placeholder="Pesquisar notícia..."
      [value]="filterSearch()" 
      (input)="onSearchChange($any($event.target).value)" 
    />
  </div>
</div>
