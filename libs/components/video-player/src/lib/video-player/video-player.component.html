<div class="video-player-container" [class.fullscreen]="isFullscreen()">
  <div class="video-wrapper" [class.playing]="isPlaying()">
    <!-- Vídeo de background espelhado para preenchimento com blur -->
    <video
      #videoBlurElement
      class="blur-bg"
      [src]="src()"
      [poster]="poster()"
      [muted]="true"
      [loop]="loop()"
      [autoplay]="autoplay()"
      [preload]="preload()"
      tabindex="-1"
      aria-hidden="true"
    ></video>

    <video
      #videoElement
      [src]="src()"
      [poster]="poster()"
      [muted]="muted()"
      [loop]="loop()"
      [autoplay]="autoplay()"
      class="video-element"
      [preload]="preload()"
      (click)="onVideoClick($event)"
    ></video>

    @if (hasThumbnail()) {
      <img 
        class="thumbnail-overlay" 
        [src]="hasThumbnail()" 
        alt="Thumbnail do vídeo"
      />
    }
    
    @if (!isPlaying()) {
      <div class="center-play-overlay">
        <button 
          class="center-play-button"
          (click)="togglePlay()"
          [attr.aria-label]="'Reproduzir vídeo'"
        >
          <span class="material-icons">play_arrow</span>
        </button>
      </div>
    }

    @if (controls() && hasPlayedOnce()) {
      <div class="controls-overlay" [class.hidden]="!showControls() && isPlaying()">
        <!-- Barra de progresso -->
        <lib-video-progress-bar
          [progress]="progress()"
          [buffered]="buffered()"
          [duration]="duration()"
          [formatTimeFn]="formatTime.bind(this)"
          (seek)="seekByPercentage($event)"
        />

        <!-- Controles principais -->
        <lib-video-controls-bar
          [isPlaying]="isPlaying()"
          [volume]="volume()"
          [isMuted]="isMuted()"
          [currentTimeFormatted]="formattedCurrentTime()"
          [durationFormatted]="formattedDuration()"
          [playbackRate]="playbackRate()"
          [isFullscreen]="isFullscreen()"
          (playToggle)="togglePlay()"
          (volumeChange)="setVolume($event)"
          (muteToggle)="toggleMute()"
          (playbackRateChange)="setPlaybackRate($event)"
          (fullscreenToggle)="toggleFullscreen()"
        />
      </div>
    }
  </div>
</div>
